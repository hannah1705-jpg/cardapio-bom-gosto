<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Espetaria Bom Gosto | Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --accent: #fff;
    --header-bg: #f97102;
    --qr-text: #111;
    --qr-border: #111;
    --muted: #a3a3a3;
    --line: #2b2b2b;
    --display: "Anton", Impact, "Arial Narrow", sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* sem zoom: trava pinça e toque duplo, e evita o aumento automático de texto */
  html {
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 96px);
    scroll-behavior: smooth;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    touch-action: pan-x pan-y;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px 44px; }

  header { padding: 32px 0 22px; position: relative; isolation: isolate; }
  header::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); background: var(--header-bg); }
  header.centro { text-align: center; padding: 26px 0 24px; }
  header h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(48px, 15vw, 88px);
    line-height: .92;
    letter-spacing: .01em;
    margin: 0;
    text-transform: uppercase;
  }
  h1.logo { margin: 0; line-height: 0; letter-spacing: 0; font-size: 0; }
  h1.logo { display: flex; justify-content: center; }
  h1.logo img { display: block; width: min(84vw, 340px); height: auto; }
  header p { margin: 12px 0 0; color: var(--muted); font-size: 15px; max-width: 30em; }

  .qr {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    border: 1.5px solid var(--qr-border);
    border-radius: 14px;
    padding: 12px 18px 12px 12px;
  }
  #qrcode { background: #fff; padding: 5px; border-radius: 8px; line-height: 0; min-width: 40px; min-height: 40px; }
  #qrcode img, #qrcode canvas { display: block; }
  .qr span { font-size: 14px; color: var(--qr-text); max-width: 12em; text-align: left; }

  nav {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    padding: 8px 16px;
    margin: 0 -16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    border-bottom: 1px solid var(--line);
  }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    font-size: 12px;
    text-align: center;
    padding: 6px 2px;
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    white-space: nowrap;
  }
  nav a.on { background: var(--accent); color: var(--bg); }
  nav a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  section { padding-top: 34px; }
  section h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 42px;
    line-height: 1;
    margin: 0 0 12px;
    text-transform: uppercase;
  }
  /* espeto: linha fina com a ponta em bolinha */
  .espeto { display: flex; align-items: center; }
  .espeto::before { content: ""; flex: 1; height: 2px; background: var(--accent); }
  .espeto::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-left: -1px; }
  .nota { color: var(--muted); font-size: 15px; margin: 12px 0 0; }

  .sub { font-weight: 600; font-size: 14px; color: var(--muted); margin: 20px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .nome { font-size: 15.5px; flex: 0 1 auto; min-width: 0; }
  li.d { flex-wrap: wrap; }
  .desc { flex: 0 0 100%; order: 4; margin: 1px 0 0; font-size: 13px; line-height: 1.3; color: var(--muted); }
  .pts { flex: 1 1 10px; border-bottom: 1px dotted #444; transform: translateY(-3px); min-width: 8px; }
  .preco { color: var(--accent); font-family: var(--display); font-size: 18px; letter-spacing: .01em; white-space: nowrap; flex: 0 0 auto; }

  footer { margin-top: 36px; color: var(--muted); font-size: 14px; }
</style>
</head>

  // destaca a aba da seção visível
  var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
  var secoes = DATA.map(function (s) { return document.getElementById(s.id); });
  var ultimo = -1;
  function marca() {
    var atual = 0;
    secoes.forEach(function (s, idx) {
      if (s.getBoundingClientRect().top < window.innerHeight * 0.4) atual = idx;
    });
    if (atual === ultimo) return;
    ultimo = atual;
    links.forEach(function (a, idx) { a.classList.toggle("on", idx === atual); });
  }
  window.addEventListener("scroll", marca, { passive: true });
  marca();
</script>
</body>
</html>
